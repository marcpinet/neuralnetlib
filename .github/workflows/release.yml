name: Create Release on Push

on:
  push:
    branches:
      - main
    paths:
      - 'setup.py'
  workflow_dispatch:

jobs:
  check-version-changed:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version-change.outputs.version_changed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Check if the version is already released
        id: version-change
        run: |
          VERSION=$(grep -Po "version='\K.*?(?=')" setup.py)
          echo "Version: $VERSION"

          # The version is released when its tag exists. Comparing with the previous commit would miss the version
          # bumps that are not the last commit of a push.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          else
            echo "No tag v$VERSION yet"
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi

  release:
    needs: check-version-changed
    if: needs.check-version-changed.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure all tags are fetched
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Extract Version from setup.py
        id: get_version
        run: |
          echo "VERSION=$(python setup.py --version)" >> $GITHUB_OUTPUT
      - name: Create and Push Tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          NEW_TAG="v${{ steps.get_version.outputs.VERSION }}"
          git tag $NEW_TAG
          git push origin $NEW_TAG
      - name: Generate Release Notes
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          NEW_TAG="v$VERSION"

          # The section of the version in CHANGELOG.md ("## [x.y.z] ..." up to the next "## " heading)
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" version "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release_notes.md 2> /dev/null || true

          # Otherwise, the commit messages since the previous tag
          if [ -z "$(tr -d '[:space:]' < release_notes.md)" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 "$NEW_TAG^")
            git log "$LAST_TAG...$NEW_TAG" --pretty=format:"- %s" --reverse > release_notes.md
          fi

          cat release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "neuralnetlib ${{ steps.get_version.outputs.VERSION }}"
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}