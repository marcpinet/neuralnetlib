name: Publish Python Package

on:
  push:
    branches:
      - main
    paths:
      - 'setup.py'
  workflow_dispatch:

jobs:
  check-version-changed:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version-change.outputs.version_changed }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Check if the version is already on PyPI
        id: version-change
        run: |
          VERSION=$(grep -Po "version='\K.*?(?=')" setup.py)
          echo "Version: $VERSION"

          # The version is published when PyPI knows it. Comparing with the previous commit would miss the version
          # bumps that are not the last commit of a push.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/neuralnetlib/$VERSION/json")
          if [ "$STATUS" = "404" ]; then
            echo "Version $VERSION is not on PyPI yet"
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION is already on PyPI (HTTP status $STATUS)"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: check-version-changed
    if: needs.check-version-changed.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -r requirements.txt
      - name: Run Unit Tests
        run: |
          python -m unittest discover tests
      - name: Build and publish
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python -m build
          twine check dist/*
          twine upload dist/*